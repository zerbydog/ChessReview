<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ChessReview</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#1D9E75;--green-dark:#0F6E56;--green-light:#f0faf6;
  --orange:#D85A30;--blue:#2563eb;
  --bg:#f5f5f0;--surface:white;--border:#e8e8e8;
  --text:#1a1a1a;--text-muted:#888;--text-light:#aaa;
  --sq-light:#f0ece4;--sq-dark:#b58863;
  --sq-hl:rgba(255,213,0,0.6);--sq-check:rgba(220,38,38,0.5);
}
body{font-family:'DM Sans',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.app{max-width:960px;margin:0 auto;padding:1.5rem 1rem}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:38px;height:38px;background:#1a1a1a;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.app-title{font-size:18px;font-weight:700}
.app-sub{font-size:12px;color:var(--text-muted)}
.card{background:white;border:1px solid var(--border);border-radius:12px;padding:1rem 1.25rem;margin-bottom:12px}
.sec-title{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.green-btn{background:var(--green);color:white;border:none;border-radius:8px;padding:9px 20px;font-size:13px;cursor:pointer;font-weight:600;font-family:inherit;transition:background .15s;display:inline-flex;align-items:center;gap:6px}
.green-btn:hover{background:var(--green-dark)}
.green-btn:disabled{opacity:.6;cursor:not-allowed}
.ghost-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:13px;color:var(--text-muted);cursor:pointer;font-family:inherit;transition:all .15s}
.ghost-btn:hover{background:var(--bg);color:var(--text)}
.input-row{display:flex;gap:10px;align-items:center}
.main-input{flex:1;font-size:14px;padding:10px 14px;border:1px solid var(--border);border-radius:9px;outline:none;font-family:inherit}
.main-input:focus{border-color:var(--green)}
.err-msg{font-size:13px;color:var(--orange);margin-top:8px}
.profile-row{display:flex;align-items:center;gap:12px;padding:6px 0}
.profile-avatar{width:44px;height:44px;border-radius:50%;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;overflow:hidden}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-name{font-size:15px;font-weight:700}
.profile-sub{font-size:12px;color:var(--text-muted)}
.stat-pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;background:var(--bg);border-radius:99px;padding:3px 9px;margin-right:4px;margin-top:4px}
.game-list{max-height:420px;overflow-y:auto}
.game-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.game-item:last-child{border-bottom:none}
.game-item:hover{background:var(--bg)}
.game-item.selected{background:var(--green-light);border-left:3px solid var(--green)}
.game-result{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.result-win{background:#dcfce7;color:#166534}
.result-loss{background:#fee2e2;color:#991b1b}
.result-draw{background:#f3f4f6;color:#374151}
.game-meta{font-size:12px;color:var(--text-muted);margin-top:2px}

/* ── Custom chess board ── */
.chess-board-wrap{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.eval-bar-col{display:flex;flex-direction:column;align-items:center;gap:4px}
#eval-bar{width:14px;border-radius:4px;overflow:hidden;border:1px solid #ccc;display:flex;flex-direction:column}
#eval-black{background:#1a1a1a;transition:height .4s}
#eval-white{background:#f0ece4;transition:height .4s}
#eval-num{font-size:11px;font-weight:700;color:var(--text-muted);font-family:'DM Mono',monospace}
.board-and-side{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;flex:1}
#chess-board{display:grid;grid-template-columns:repeat(8,1fr);border:2px solid #8b6914;border-radius:2px;user-select:none;flex-shrink:0}
.sq{width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-size:36px;cursor:pointer;position:relative;transition:background .1s}
.sq.light{background:var(--sq-light)}
.sq.dark{background:var(--sq-dark)}
.sq.hl{background:var(--sq-hl)!important}
.sq.selected-sq{background:rgba(20,85,255,0.4)!important}
.sq.last-from{background:rgba(255,213,0,0.5)!important}
.sq.last-to{background:rgba(255,213,0,0.7)!important}
.sq.check{background:var(--sq-check)!important}
.sq .coord-file{position:absolute;bottom:1px;right:2px;font-size:9px;font-weight:700;opacity:.7;font-family:'DM Mono',monospace;line-height:1}
.sq .coord-rank{position:absolute;top:1px;left:2px;font-size:9px;font-weight:700;opacity:.7;font-family:'DM Mono',monospace;line-height:1}
.piece{line-height:1;pointer-events:none}

/* Side panel */
.board-side{min-width:200px;flex:1}
.player-bar{display:flex;align-items:center;justify-content:space-between;padding:5px 0;margin:4px 0}
.player-name{font-size:13px;font-weight:600}
.player-rating{font-size:12px;color:var(--text-muted);margin-left:4px}
.tab-row{display:flex;gap:4px;margin-bottom:10px}
.tab-btn{font-size:12px;padding:5px 11px;border:1px solid var(--border);border-radius:99px;background:white;cursor:pointer;color:var(--text-muted);font-family:inherit;transition:all .15s}
.tab-btn.active{background:#1a1a1a;border-color:#1a1a1a;color:white;font-weight:600}
.move-list{display:flex;flex-wrap:wrap;gap:2px;max-height:200px;overflow-y:auto;padding:2px 0}
.move-num{font-size:11px;color:var(--text-muted);padding:3px 2px;align-self:center;font-family:'DM Mono',monospace}
.move-btn{font-size:12px;padding:3px 7px;border:none;border-radius:4px;cursor:pointer;font-family:'DM Mono',monospace;background:var(--bg);color:var(--text);transition:all .15s;border-left:3px solid transparent}
.move-btn:hover{background:#e5e5e5}
.move-btn.active{background:#1a1a1a;color:white}
.move-btn.blunder{border-left-color:#dc2626}
.move-btn.mistake{border-left-color:#ea580c}
.move-btn.inaccuracy{border-left-color:#f59e0b}
.move-btn.good{border-left-color:#16a34a}
.controls{display:flex;gap:5px;margin-top:8px}
.ctrl-btn{background:white;border:1px solid var(--border);border-radius:7px;padding:6px 10px;font-size:16px;cursor:pointer;transition:all .15s;line-height:1}
.ctrl-btn:hover{background:var(--bg)}
.ctrl-btn:disabled{opacity:.3;cursor:not-allowed}
.ai-explanation{font-size:13px;line-height:1.7;background:var(--green-light);border-radius:10px;padding:10px 14px;margin-top:8px}
.eval-display{font-size:20px;font-weight:700;margin-bottom:2px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--green-light);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-dots{display:inline-flex;gap:4px}
.loading-dots span{width:5px;height:5px;border-radius:50%;background:var(--green);animation:bounce 1.2s infinite}
.loading-dots span:nth-child(2){animation-delay:.2s}
.loading-dots span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
.no-data{text-align:center;padding:1.5rem;color:var(--text-light);font-size:13px}
@media(max-width:600px){.sq{width:40px;height:40px;font-size:28px}}
@media(max-width:480px){.sq{width:34px;height:34px;font-size:24px}}
</style>
</head>
<body>
<div class="app">

<div class="header">
  <div class="logo">
    <div class="logo-icon">&#9822;</div>
    <div><div class="app-title">ChessReview</div><div class="app-sub">Free unlimited game analysis</div></div>
  </div>
</div>

<!-- SEARCH -->
<div id="search-section">
  <div class="card">
    <div class="sec-title">Enter your Chess.com username</div>
    <div class="input-row">
      <input class="main-input" type="text" id="username-input" placeholder="e.g. magnuscarlsen" onkeydown="if(event.key==='Enter')loadProfile()"/>
      <button class="green-btn" id="search-btn" onclick="loadProfile()">&#9654; Load games</button>
    </div>
    <div class="err-msg" id="search-err" style="display:none"></div>
  </div>
</div>

<!-- PROFILE + GAME LIST -->
<div id="profile-section" style="display:none">
  <div class="card">
    <div class="profile-row">
      <div class="profile-avatar" id="profile-avatar">&#128100;</div>
      <div style="flex:1">
        <div class="profile-name" id="profile-name"></div>
        <div class="profile-sub" id="profile-sub"></div>
        <div id="profile-stats" style="margin-top:4px"></div>
      </div>
      <button class="ghost-btn" onclick="resetSearch()" style="font-size:12px">&#8592; Change</button>
    </div>
  </div>
  <div class="card" style="padding:0;overflow:hidden">
    <div style="padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
      <div class="sec-title" style="margin-bottom:0">Recent games</div>
      <div style="display:flex;gap:6px">
        <select id="tc-filter" onchange="filterGames()" style="font-size:12px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-family:inherit">
          <option value="all">All formats</option>
          <option value="bullet">Bullet</option>
          <option value="blitz">Blitz</option>
          <option value="rapid">Rapid</option>
          <option value="daily">Daily</option>
        </select>
        <select id="res-filter" onchange="filterGames()" style="font-size:12px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-family:inherit">
          <option value="all">All results</option>
          <option value="win">Wins</option>
          <option value="loss">Losses</option>
          <option value="draw">Draws</option>
        </select>
      </div>
    </div>
    <div class="game-list" id="game-list"><div class="no-data"><span class="spin"></span> Loading...</div></div>
  </div>
</div>

<!-- BOARD SECTION -->
<div id="board-section" style="display:none">
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
    <button class="ghost-btn" onclick="closeBoard()" style="font-size:12px">&#8592; Games</button>
    <div id="game-title" style="font-size:13px;font-weight:600;color:var(--text-muted)"></div>
  </div>
  <div class="card">
    <div class="player-bar">
      <div><span class="player-name" id="top-name"></span><span class="player-rating" id="top-rating"></span></div>
    </div>
    <div class="chess-board-wrap">
      <div class="eval-bar-col">
        <div id="eval-bar" style="height:384px"><div id="eval-black" style="height:50%"></div><div id="eval-white" style="height:50%"></div></div>
        <div id="eval-num">0.0</div>
      </div>
      <div class="board-and-side">
        <div id="chess-board"></div>
        <div class="board-side">
          <div class="tab-row">
            <button class="tab-btn active" onclick="showTab('moves',this)">Moves</button>
            <button class="tab-btn" onclick="showTab('analysis',this)">Analysis</button>
          </div>
          <div id="tab-moves">
            <div class="move-list" id="move-list"></div>
            <div class="controls">
              <button class="ctrl-btn" onclick="goToMove(0)" title="Start">&#8676;</button>
              <button class="ctrl-btn" onclick="prevMove()" title="Prev">&#8592;</button>
              <button class="ctrl-btn" onclick="nextMove()" title="Next">&#8594;</button>
              <button class="ctrl-btn" onclick="goToMove(99999)" title="End">&#8677;</button>
              <button class="ctrl-btn" onclick="flipBoard()" title="Flip">&#8645;</button>
            </div>
          </div>
          <div id="tab-analysis" style="display:none">
            <div id="analysis-content"><div class="no-data">Navigate to a move then click Analyze</div></div>
            <button class="green-btn" id="analyze-btn" onclick="analyzePosition()" style="width:100%;justify-content:center;margin-top:8px">&#9881; Analyze position</button>
          </div>
        </div>
      </div>
    </div>
    <div class="player-bar" style="margin-top:4px">
      <div><span class="player-name" id="bottom-name"></span><span class="player-rating" id="bottom-rating"></span></div>
    </div>
  </div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
// ── Piece Unicode map ─────────────────────────────────────
const PIECES={
  wK:'&#9812;',wQ:'&#9813;',wR:'&#9814;',wB:'&#9815;',wN:'&#9816;',wP:'&#9817;',
  bK:'&#9818;',bQ:'&#9819;',bR:'&#9820;',bB:'&#9821;',bN:'&#9822;',bP:'&#9823;'
};

const OPENROUTER_KEY='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';

let currentUsername='',allGames=[],filteredGames=[],currentGame=null;
let chess=null,currentMoveIdx=0,moveHistory=[],flipped=false;

// ── Chess.com API ─────────────────────────────────────────
async function loadProfile(){
  const username=document.getElementById('username-input').value.trim().toLowerCase();
  if(!username)return;
  const btn=document.getElementById('search-btn');
  const err=document.getElementById('search-err');
  btn.disabled=true;btn.innerHTML='<span class="spin"></span> Loading...';
  err.style.display='none';
  try{
    const[pRes,sRes]=await Promise.all([
      fetch('https://api.chess.com/pub/player/'+username),
      fetch('https://api.chess.com/pub/player/'+username+'/stats')
    ]);
    if(!pRes.ok)throw new Error('Player "'+username+'" not found on Chess.com');
    const p=await pRes.json();const s=await sRes.json();
    currentUsername=username;
    renderProfile(p,s);
    await loadGames(username);
    document.getElementById('search-section').style.display='none';
    document.getElementById('profile-section').style.display='block';
  }catch(e){err.textContent=e.message;err.style.display='block';}
  btn.disabled=false;btn.innerHTML='&#9654; Load games';
}

function renderProfile(p,s){
  const av=document.getElementById('profile-avatar');
  if(p.avatar)av.innerHTML='<img src="'+p.avatar+'" alt="av"/>';
  else av.innerHTML='&#128100;';
  document.getElementById('profile-name').textContent=p.username;
  document.getElementById('profile-sub').textContent=(p.title?p.title+' | ':'')+( p.location||'Chess.com');
  const r=[];
  if(s.chess_bullet)r.push('<span class="stat-pill">&#9889; Bullet '+s.chess_bullet.last.rating+'</span>');
  if(s.chess_blitz)r.push('<span class="stat-pill">&#128293; Blitz '+s.chess_blitz.last.rating+'</span>');
  if(s.chess_rapid)r.push('<span class="stat-pill">&#9201; Rapid '+s.chess_rapid.last.rating+'</span>');
  document.getElementById('profile-stats').innerHTML=r.join('');
}

async function loadGames(username){
  const el=document.getElementById('game-list');
  el.innerHTML='<div class="no-data"><span class="spin"></span> Fetching games...</div>';
  const archRes=await fetch('https://api.chess.com/pub/player/'+username+'/games/archives');
  const archData=await archRes.json();
  const archives=archData.archives||[];
  if(!archives.length){el.innerHTML='<div class="no-data">No games found.</div>';return;}
  let games=[];
  for(const url of archives.slice(-2).reverse()){
    const res=await fetch(url);const d=await res.json();
    games=[...games,...(d.games||[])];
    if(games.length>=60)break;
  }
  allGames=games.reverse().slice(0,60);
  filterGames();
}

function getTC(g){return g.time_class||'unknown';}
function getResult(g,u){
  const isW=g.white.username.toLowerCase()===u.toLowerCase();
  const r=isW?g.white.result:g.black.result;
  if(r==='win')return 'win';
  if(['checkmated','timeout','resigned','lose','abandoned'].includes(r))return 'loss';
  return 'draw';
}
function getOpp(g,u){return g.white.username.toLowerCase()===u.toLowerCase()?g.black:g.white;}
function isWhitePlayer(g,u){return g.white.username.toLowerCase()===u.toLowerCase();}

function filterGames(){
  const tc=document.getElementById('tc-filter').value;
  const res=document.getElementById('res-filter').value;
  filteredGames=allGames.filter(g=>{
    if(tc!=='all'&&getTC(g)!==tc)return false;
    if(res!=='all'&&getResult(g,currentUsername)!==res)return false;
    return true;
  });
  renderGameList();
}

function renderGameList(){
  const el=document.getElementById('game-list');
  if(!filteredGames.length){el.innerHTML='<div class="no-data">No games match your filters.</div>';return;}
  el.innerHTML='';
  filteredGames.forEach(g=>{
    const result=getResult(g,currentUsername);
    const opp=getOpp(g,currentUsername);
    const isW=isWhitePlayer(g,currentUsername);
    const tc=getTC(g);
    const date=g.end_time?new Date(g.end_time*1000).toLocaleDateString():'';
    const div=document.createElement('div');
    div.className='game-item'+(currentGame===g?' selected':'');
    div.innerHTML='<div style="flex:1"><div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">'
      +'<span style="font-size:11px;background:'+(isW?'#f0ece4':'#333')+';color:'+(isW?'#333':'#f0ece4')+';padding:1px 5px;border-radius:3px;font-weight:700;font-size:10px">'+(isW?'W':'B')+'</span>'
      +'<span style="font-size:13px;font-weight:600">'+opp.username+'</span>'
      +'<span style="font-size:12px;color:var(--text-muted)">('+opp.rating+')</span>'
      +'</div>'
      +'<div class="game-meta">'+tc.charAt(0).toUpperCase()+tc.slice(1)+' &middot; '+date+'</div>'
      +'</div>'
      +'<span class="game-result result-'+result+'">'+result.charAt(0).toUpperCase()+result.slice(1)+'</span>';
    div.onclick=()=>openGame(g);
    el.appendChild(div);
  });
}

// ── Board ─────────────────────────────────────────────────
function buildBoard(){
  const boardEl=document.getElementById('chess-board');
  boardEl.innerHTML='';
  const size=Math.min(48,Math.floor((window.innerWidth-120)/8));
  document.querySelectorAll('.sq').forEach(s=>s.style.width=size+'px');
  for(let r=0;r<8;r++){
    for(let f=0;f<8;f++){
      const sq=document.createElement('div');
      const visualRank=flipped?r:7-r;
      const visualFile=flipped?7-f:f;
      const isLight=(visualRank+visualFile)%2===1;
      sq.className='sq '+(isLight?'light':'dark');
      sq.style.width=size+'px';sq.style.height=size+'px';
      sq.style.fontSize=Math.floor(size*0.72)+'px';
      // coords
      if(visualFile===0){const c=document.createElement('span');c.className='coord-rank';c.textContent=visualRank+1;sq.appendChild(c);}
      if(visualRank===0){const c=document.createElement('span');c.className='coord-file';c.textContent='abcdefgh'[visualFile];sq.appendChild(c);}
      const file='abcdefgh'[visualFile];
      const rank=visualRank+1;
      sq.dataset.sq=file+rank;
      boardEl.appendChild(sq);
    }
  }
  // Set eval bar height
  const barH=size*8;
  document.getElementById('eval-bar').style.height=barH+'px';
  renderPieces();
}

function renderPieces(){
  if(!chess)return;
  document.querySelectorAll('.sq').forEach(sq=>{
    // Remove old piece
    const old=sq.querySelector('.piece');if(old)old.remove();
    const sqName=sq.dataset.sq;
    const piece=chess.get(sqName);
    if(piece){
      const span=document.createElement('span');
      span.className='piece';
      const key=(piece.color==='w'?'w':'b')+piece.type.toUpperCase();
      span.innerHTML=PIECES[key]||'?';
      sq.appendChild(span);
    }
  });
  highlightLastMove();
}

function highlightLastMove(){
  document.querySelectorAll('.sq').forEach(s=>{s.classList.remove('last-from','last-to','check');});
  if(currentMoveIdx>0){
    const m=moveHistory[currentMoveIdx-1];
    const fromSq=document.querySelector('.sq[data-sq="'+m.from+'"]');
    const toSq=document.querySelector('.sq[data-sq="'+m.to+'"]');
    if(fromSq)fromSq.classList.add('last-from');
    if(toSq)toSq.classList.add('last-to');
  }
  if(chess.in_check()){
    const turn=chess.turn();
    // Find king
    for(let r=1;r<=8;r++){for(const f of 'abcdefgh'.split('')){const p=chess.get(f+r);if(p&&p.type==='k'&&p.color===turn){const sq=document.querySelector('.sq[data-sq="'+f+r+'"]');if(sq)sq.classList.add('check');}}}
  }
}

function openGame(g){
  currentGame=g;filterGames();
  chess=new Chess();
  chess.load_pgn(g.pgn);
  moveHistory=chess.history({verbose:true});
  currentMoveIdx=0;
  chess.reset();
  const isW=isWhitePlayer(g,currentUsername);
  flipped=!isW;
  // Player labels
  const top=flipped?g.white:g.black;
  const bottom=flipped?g.black:g.white;
  document.getElementById('top-name').textContent=top.username;
  document.getElementById('top-rating').textContent=' ('+top.rating+')';
  document.getElementById('bottom-name').textContent=bottom.username;
  document.getElementById('bottom-rating').textContent=' ('+bottom.rating+')';
  const result=getResult(g,currentUsername);
  document.getElementById('game-title').textContent=(isW?'White':'Black')+' vs '+getOpp(g,currentUsername).username+' — '+result;
  buildBoard();
  renderMoveList();
  updateEvalBar(0);
  document.getElementById('profile-section').style.display='none';
  document.getElementById('board-section').style.display='block';
  document.getElementById('analysis-content').innerHTML='<div class="no-data">Navigate to a move then click Analyze</div>';
}

function closeBoard(){
  document.getElementById('board-section').style.display='none';
  document.getElementById('profile-section').style.display='block';
  currentGame=null;filterGames();
}

function goToMove(idx){
  idx=Math.max(0,Math.min(idx,moveHistory.length));
  currentMoveIdx=idx;
  chess.reset();
  for(let i=0;i<idx;i++)chess.move(moveHistory[i].san);
  renderPieces();
  renderMoveList();
  const btn=document.getElementById('move-btn-'+(idx-1));
  if(btn)btn.scrollIntoView({block:'nearest'});
}
function prevMove(){goToMove(currentMoveIdx-1);}
function nextMove(){goToMove(currentMoveIdx+1);}
function flipBoard(){flipped=!flipped;buildBoard();}

function renderMoveList(){
  const el=document.getElementById('move-list');el.innerHTML='';
  moveHistory.forEach((m,i)=>{
    if(i%2===0){const n=document.createElement('span');n.className='move-num';n.textContent=(Math.floor(i/2)+1)+'.';el.appendChild(n);}
    const btn=document.createElement('button');
    btn.className='move-btn'+(i===currentMoveIdx-1?' active':'');
    btn.textContent=m.san;btn.id='move-btn-'+i;
    btn.onclick=()=>goToMove(i+1);
    el.appendChild(btn);
  });
}

function updateEvalBar(score){
  const clamped=Math.max(-10,Math.min(10,score||0));
  const blackPct=50-clamped*5;
  const bp=Math.max(5,Math.min(95,blackPct));
  document.getElementById('eval-black').style.height=bp+'%';
  document.getElementById('eval-white').style.height=(100-bp)+'%';
  const n=document.getElementById('eval-num');
  n.textContent=score>=0?'+'+parseFloat(score).toFixed(1):parseFloat(score).toFixed(1);
  n.style.color=score>0.3?'var(--green)':score<-0.3?'#dc2626':'var(--text-muted)';
}

function showTab(tab,btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
  document.getElementById('tab-moves').style.display=tab==='moves'?'block':'none';
  document.getElementById('tab-analysis').style.display=tab==='analysis'?'block':'none';
}

// ── Analysis ─────────────────────────────────────────────
async function analyzePosition(){
  if(!chess)return;
  const btn=document.getElementById('analyze-btn');
  btn.disabled=true;btn.innerHTML='<span class="spin"></span> Analyzing...';
  showTab('analysis',document.querySelectorAll('.tab-btn')[1]);
  const fen=chess.fen();
  const moveDesc=currentMoveIdx>0?'Last move: '+moveHistory[currentMoveIdx-1].san+' (move '+currentMoveIdx+')':'Starting position.';
  const isWhiteTurn=chess.turn()==='w';
  const inCheck=chess.in_check();
  const prompt='Chess position FEN: '+fen+'\n'+moveDesc+'\nIt is '+(isWhiteTurn?'White':'Black')+"'s turn to move."+(inCheck?' The king is in check.':'')+'\n\nIn 2-3 sentences explain: what the last move accomplished, what is the key strategic situation, and what the side to move should consider. Be specific — mention piece names, square names, and tactical themes like pins, forks, or open files.';
  const el=document.getElementById('analysis-content');
  el.innerHTML='<div class="ai-explanation"><div class="loading-dots"><span></span><span></span><span></span></div></div>';
  try{
    const res=await fetch('https://openrouter.ai/api/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+OPENROUTER_KEY,'HTTP-Referer':'https://zerbydog.github.io','X-Title':'ChessReview'},
      body:JSON.stringify({model:'poolside/laguna-m.1:free',messages:[{role:'user',content:prompt}]})
    });
    const data=await res.json();
    const reply=data.choices?.[0]?.message?.content||data.error?.message||'Could not get analysis.';
    const moveNum=currentMoveIdx>0?'<div style="font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:6px">Move '+currentMoveIdx+': '+moveHistory[currentMoveIdx-1].san+'</div>':'';
    el.innerHTML=moveNum+'<div class="ai-explanation">'+reply+'</div>';
  }catch(e){
    el.innerHTML='<div class="ai-explanation">Connection error. Please try again.</div>';
  }
  btn.disabled=false;btn.innerHTML='&#9881; Analyze position';
}

function resetSearch(){
  document.getElementById('search-section').style.display='block';
  document.getElementById('profile-section').style.display='none';
  document.getElementById('board-section').style.display='none';
  currentUsername='';allGames=[];
}

document.addEventListener('keydown',e=>{
  if(document.getElementById('board-section').style.display==='none')return;
  if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;
  if(e.key==='ArrowLeft'){e.preventDefault();prevMove();}
  if(e.key==='ArrowRight'){e.preventDefault();nextMove();}
});

window.addEventListener('resize',()=>{if(currentGame)buildBoard();});
</script>
