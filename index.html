<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ChessReview</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#1D9E75;--green-dark:#0F6E56;--green-light:#f0faf6;
  --orange:#D85A30;--bg:#f5f5f0;--border:#e8e8e8;
  --text:#1a1a1a;--text-muted:#888;--text-light:#aaa;
  --sq-light:#f0ece4;--sq-dark:#b58863;
  --c-brilliant:#1a9e5a;--c-great:#2563eb;--c-best:#16a34a;
  --c-good:#65a30d;--c-inaccuracy:#f59e0b;--c-miss:#ea580c;--c-blunder:#dc2626;
}
body{font-family:'DM Sans',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.app{max-width:980px;margin:0 auto;padding:1.5rem 1rem}
.header{display:flex;align-items:center;margin-bottom:1.5rem}
.logo-icon{width:38px;height:38px;background:#1a1a1a;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-right:10px}
.app-title{font-size:18px;font-weight:700}
.app-sub{font-size:12px;color:var(--text-muted)}
.card{background:white;border:1px solid var(--border);border-radius:12px;padding:1rem 1.25rem;margin-bottom:12px}
.sec-title{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.green-btn{background:var(--green);color:white;border:none;border-radius:8px;padding:9px 20px;font-size:13px;cursor:pointer;font-weight:600;font-family:inherit;transition:background .15s;display:inline-flex;align-items:center;gap:6px}
.green-btn:hover{background:var(--green-dark)}
.green-btn:disabled{opacity:.6;cursor:not-allowed}
.ghost-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:13px;color:var(--text-muted);cursor:pointer;font-family:inherit;transition:all .15s}
.ghost-btn:hover{background:var(--bg);color:var(--text)}
.input-row{display:flex;gap:10px;align-items:center}
.main-input{flex:1;font-size:14px;padding:10px 14px;border:1px solid var(--border);border-radius:9px;outline:none;font-family:inherit}
.main-input:focus{border-color:var(--green)}
.err-msg{font-size:13px;color:var(--orange);margin-top:8px}
.profile-row{display:flex;align-items:center;gap:12px;padding:6px 0}
.profile-avatar{width:44px;height:44px;border-radius:50%;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;overflow:hidden}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.stat-pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;background:var(--bg);border-radius:99px;padding:3px 9px;margin-right:4px;margin-top:4px}
.game-list{max-height:420px;overflow-y:auto}
.game-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.game-item:last-child{border-bottom:none}
.game-item:hover{background:var(--bg)}
.game-item.selected{background:var(--green-light);border-left:3px solid var(--green)}
.game-result{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.result-win{background:#dcfce7;color:#166534}
.result-loss{background:#fee2e2;color:#991b1b}
.result-draw{background:#f3f4f6;color:#374151}
.game-meta{font-size:12px;color:var(--text-muted);margin-top:2px}
.chess-board-wrap{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.eval-col{display:flex;flex-direction:column;align-items:center;gap:4px}
#eval-bar{width:14px;border-radius:4px;overflow:hidden;border:1px solid #ccc;display:flex;flex-direction:column}
#eval-black{background:#1a1a1a;transition:height .5s}
#eval-white{background:#f0ece4;transition:height .5s}
#eval-num{font-size:11px;font-weight:700;font-family:'DM Mono',monospace;color:var(--text-muted)}
#chess-board{display:grid;grid-template-columns:repeat(8,1fr);border:2px solid #8b6914;border-radius:2px;user-select:none;flex-shrink:0}
.sq{display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.sq.light{background:var(--sq-light)}.sq.dark{background:var(--sq-dark)}
.sq.last-from{background:rgba(255,213,0,0.45)!important}
.sq.last-to{background:rgba(255,213,0,0.7)!important}
.sq.check{background:rgba(220,38,38,0.5)!important}
.coord-file{position:absolute;bottom:1px;right:2px;font-size:9px;font-weight:700;opacity:.6;font-family:'DM Mono',monospace;line-height:1}
.coord-rank{position:absolute;top:1px;left:2px;font-size:9px;font-weight:700;opacity:.6;font-family:'DM Mono',monospace;line-height:1}
.piece{line-height:1;pointer-events:none}
.board-side{min-width:210px;flex:1}
.player-bar{display:flex;align-items:center;justify-content:space-between;padding:5px 2px;margin:3px 0}
.player-name{font-size:13px;font-weight:600}
.player-rating{font-size:12px;color:var(--text-muted);margin-left:3px}
.tab-row{display:flex;gap:4px;margin-bottom:10px}
.tab-btn{font-size:12px;padding:5px 11px;border:1px solid var(--border);border-radius:99px;background:white;cursor:pointer;color:var(--text-muted);font-family:inherit;transition:all .15s}
.tab-btn.active{background:#1a1a1a;border-color:#1a1a1a;color:white;font-weight:600}
.move-list{display:flex;flex-wrap:wrap;gap:2px;max-height:210px;overflow-y:auto;padding:2px 0}
.move-num{font-size:11px;color:var(--text-muted);padding:3px 2px;align-self:center;font-family:'DM Mono',monospace}
.move-btn{font-size:12px;padding:3px 7px;border:none;border-radius:4px;cursor:pointer;font-family:'DM Mono',monospace;background:var(--bg);color:var(--text);transition:all .15s;white-space:nowrap}
.move-btn:hover{background:#e5e5e5}
.move-btn.active{background:#1a1a1a;color:white}
.controls{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.ctrl-btn{background:white;border:1px solid var(--border);border-radius:7px;padding:6px 10px;font-size:16px;cursor:pointer;transition:all .15s;line-height:1}
.ctrl-btn:hover{background:var(--bg)}
.class-badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;margin-bottom:8px}
.ai-box{font-size:13px;line-height:1.7;background:var(--green-light);border-radius:10px;padding:10px 14px;margin-top:8px}
.eval-score-display{font-size:20px;font-weight:700;margin-bottom:2px;font-family:'DM Mono',monospace}
.best-move-box{background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-top:8px;font-size:12px}
.progress-card{background:white;border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:10px}
.progress-bar-wrap{height:6px;background:#f0f0f0;border-radius:99px;overflow:hidden;margin-top:6px}
.progress-bar{height:6px;background:var(--green);border-radius:99px;transition:width .3s}
.summary-card{display:none}
.acc-grid{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.acc-box{flex:1;min-width:120px;background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.acc-val{font-size:22px;font-weight:700}
.acc-name{font-size:12px;color:var(--text-muted);margin-bottom:4px}
.class-counts{font-size:11px;margin-top:4px;line-height:1.8}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--green-light);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.ld{display:inline-flex;gap:4px}
.ld span{width:5px;height:5px;border-radius:50%;background:var(--green);animation:bo 1.2s infinite}
.ld span:nth-child(2){animation-delay:.2s}.ld span:nth-child(3){animation-delay:.4s}
@keyframes bo{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
.no-data{text-align:center;padding:1.5rem;color:var(--text-light);font-size:13px}
@media(max-width:600px){.sq{font-size:26px!important}}
@media(max-width:420px){.sq{font-size:22px!important}}
</style>
</head>
<body>
<div class="app">
<div class="header">
  <div class="logo-icon">&#9822;</div>
  <div><div class="app-title">ChessReview</div><div class="app-sub">Free unlimited game analysis</div></div>
</div>

<div id="search-section">
  <div class="card">
    <div class="sec-title">Enter your Chess.com username</div>
    <div class="input-row">
      <input class="main-input" type="text" id="username-input" placeholder="e.g. magnuscarlsen" onkeydown="if(event.key==='Enter')loadProfile()"/>
      <button class="green-btn" id="search-btn" onclick="loadProfile()">&#9654; Load games</button>
    </div>
    <div class="err-msg" id="search-err" style="display:none"></div>
  </div>
</div>

<div id="profile-section" style="display:none">
  <div class="card">
    <div class="profile-row">
      <div class="profile-avatar" id="profile-avatar">&#128100;</div>
      <div style="flex:1">
        <div style="font-size:15px;font-weight:700" id="profile-name"></div>
        <div style="font-size:12px;color:var(--text-muted)" id="profile-sub"></div>
        <div id="profile-stats" style="margin-top:4px"></div>
      </div>
      <button class="ghost-btn" onclick="resetSearch()" style="font-size:12px">&#8592; Change</button>
    </div>
  </div>
  <div class="card" style="padding:0;overflow:hidden">
    <div style="padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
      <div class="sec-title" style="margin-bottom:0">Recent games</div>
      <div style="display:flex;gap:6px">
        <select id="tc-filter" onchange="filterGames()" style="font-size:12px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-family:inherit">
          <option value="all">All formats</option><option value="bullet">Bullet</option>
          <option value="blitz">Blitz</option><option value="rapid">Rapid</option><option value="daily">Daily</option>
        </select>
        <select id="res-filter" onchange="filterGames()" style="font-size:12px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-family:inherit">
          <option value="all">All results</option><option value="win">Wins</option>
          <option value="loss">Losses</option><option value="draw">Draws</option>
        </select>
      </div>
    </div>
    <div class="game-list" id="game-list"><div class="no-data"><span class="spin"></span> Loading...</div></div>
  </div>
</div>

<div id="board-section" style="display:none">
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap">
    <button class="ghost-btn" onclick="closeBoard()" style="font-size:12px">&#8592; Games</button>
    <div id="game-title" style="font-size:13px;font-weight:600;color:var(--text-muted);flex:1"></div>
    <button class="green-btn" id="full-btn" onclick="runFullAnalysis()" style="font-size:12px;padding:7px 14px">&#9881; Full analysis</button>
  </div>

  <div id="progress-card" class="progress-card" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div style="font-size:13px;font-weight:600" id="progress-label">Analyzing...</div>
      <div style="font-size:12px;color:var(--text-muted)" id="progress-pct">0%</div>
    </div>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progress-bar" style="width:0%"></div></div>
  </div>

  <div class="summary-card card" id="summary-card">
    <div style="font-size:14px;font-weight:700;margin-bottom:8px">Analysis complete</div>
    <div class="acc-grid" id="acc-grid"></div>
  </div>

  <div class="card">
    <div class="player-bar">
      <div><span class="player-name" id="top-name"></span><span class="player-rating" id="top-rating"></span></div>
      <span id="top-acc" style="display:none;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px"></span>
    </div>
    <div class="chess-board-wrap">
      <div class="eval-col">
        <div id="eval-bar"><div id="eval-black" style="height:50%"></div><div id="eval-white" style="height:50%"></div></div>
        <div id="eval-num">0.0</div>
      </div>
      <div style="display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;flex:1">
        <div id="chess-board"></div>
        <div class="board-side">
          <div class="tab-row">
            <button class="tab-btn active" id="tbtn-moves" onclick="showTab('moves',this)">Moves</button>
            <button class="tab-btn" id="tbtn-analysis" onclick="showTab('analysis',this)">Analysis</button>
          </div>
          <div id="tab-moves">
            <div class="move-list" id="move-list"></div>
            <div class="controls">
              <button class="ctrl-btn" onclick="goToMove(0)">&#8676;</button>
              <button class="ctrl-btn" onclick="prevMove()">&#8592;</button>
              <button class="ctrl-btn" onclick="nextMove()">&#8594;</button>
              <button class="ctrl-btn" onclick="goToMove(99999)">&#8677;</button>
              <button class="ctrl-btn" onclick="flipBoard()">&#8645;</button>
            </div>
          </div>
          <div id="tab-analysis" style="display:none">
            <div id="analysis-panel"><div class="no-data">Run full analysis, then navigate to any move</div></div>
            <div style="display:flex;gap:6px;margin-top:8px">
              <button class="ctrl-btn" onclick="prevMove();setTimeout(showMoveAnalysis,100)">&#8592;</button>
              <button class="green-btn" id="explain-btn" onclick="explainMove()" style="flex:1;justify-content:center;font-size:12px">&#9881; Explain move</button>
              <button class="ctrl-btn" onclick="nextMove();setTimeout(showMoveAnalysis,100)">&#8594;</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="player-bar" style="margin-top:4px">
      <div><span class="player-name" id="bottom-name"></span><span class="player-rating" id="bottom-rating"></span></div>
      <span id="bottom-acc" style="display:none;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px"></span>
    </div>
  </div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stockfish@16.0.0/src/stockfish-nnue-16.js"></script>
<script>
const SUPABASE_URL='https://rttwejkhzjjdnbzpwqtg.supabase.co';
const SUPABASE_KEY='sb_publishable_0bIPDF8WlM5-rQEMvRiIHQ_wu84Buvc';
const EDGE='https://rttwejkhzjjdnbzpwqtg.supabase.co/functions/v1/ai-chess';

const PIECES={wK:'&#9812;',wQ:'&#9813;',wR:'&#9814;',wB:'&#9815;',wN:'&#9816;',wP:'&#9817;',
  bK:'&#9818;',bQ:'&#9819;',bR:'&#9820;',bB:'&#9821;',bN:'&#9822;',bP:'&#9823;'};

// Classification: symbol, label, color, bg
const CLS={
  brilliant:{s:'!!',l:'Brilliant',c:'#1a9e5a',bg:'#dcfce7'},
  great:{s:'!',l:'Great',c:'#2563eb',bg:'#dbeafe'},
  best:{s:'★',l:'Best',c:'#16a34a',bg:'#dcfce7'},
  good:{s:'✓',l:'Good',c:'#65a30d',bg:'#ecfccb'},
  inaccuracy:{s:'?!',l:'Inaccuracy',c:'#f59e0b',bg:'#fef3c7'},
  miss:{s:'?',l:'Mistake',c:'#ea580c',bg:'#ffedd5'},
  blunder:{s:'??',l:'Blunder',c:'#dc2626',bg:'#fee2e2'},
};

let username='',allGames=[],filtGames=[],curGame=null;
let chess=null,moveIdx=0,moves=[],flipped=false,moveEvals=[];
let sf=null,sfReady=false,sfHandler=null;

// ── Stockfish ─────────────────────────────────────────────
async function initSF(){
  if(sfReady)return true;
  // Try blob worker approach with multiple CDN fallbacks
  const urls=[
    'https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js',
    'https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js'
  ];
  for(const url of urls){
    try{
      const r=await fetch(url);if(!r.ok)continue;
      const txt=await r.text();
      const blob=new Blob([txt],{type:'application/javascript'});
      const w=new Worker(URL.createObjectURL(blob));
      const ok=await new Promise((res,rej)=>{
        const t=setTimeout(()=>rej('timeout'),8000);
        w.onmessage=e=>{
          const d=e.data||'';
          if(d==='uciok')w.postMessage('isready');
          if(d==='readyok'){clearTimeout(t);res(true);}
        };
        w.onerror=()=>rej('error');
        w.postMessage('uci');
      });
      if(ok){
        sf=w;sfReady=true;
        sf.onmessage=e=>{if(sfHandler)sfHandler(e.data||'');};
        return true;
      }
    }catch(e){continue;}
  }
  return false;
}

// Evaluate a FEN, returns {wpCp, bestMove} where wpCp is white-perspective centipawns
function evalFen(fen,depth){
  return new Promise(res=>{
    // Check terminal positions
    const tmp=new Chess(fen);
    if(tmp.game_over()){
      let wpCp=0;
      if(tmp.in_checkmate())wpCp=tmp.turn()==='w'?-9999:9999;
      res({wpCp,bestMove:null});return;
    }
    if(!sf||!sfReady){res({wpCp:0,bestMove:null});return;}
    let cp=0,mate=null,best=null;
    const timeout=setTimeout(()=>{sfHandler=null;res({wpCp:scoreToWp(cp,mate,fen),bestMove:best});},6000);
    sfHandler=line=>{
      if(typeof line!=='string')line='';
      const sm=line.match(/score (cp|mate) (-?\d+)/);
      if(sm){if(sm[1]==='cp')cp=parseInt(sm[2]);else mate=parseInt(sm[2]);}
      const bm=line.match(/^bestmove (\S+)/);
      if(bm){clearTimeout(timeout);sfHandler=null;best=bm[1]==='(none)'?null:bm[1];res({wpCp:scoreToWp(cp,mate,fen),bestMove:best});}
    };
    sf.postMessage('position fen '+fen);
    sf.postMessage('go depth '+(depth||14));
  });
}

function scoreToWp(cp,mate,fen){
  // Stockfish reports from side-to-move perspective. Convert to white-perspective.
  const turn=new Chess(fen).turn();
  let score=mate!==null?(mate>0?9999:-9999):cp;
  return turn==='w'?score:-score; // white perspective
}

// ── Full game analysis ────────────────────────────────────
async function runFullAnalysis(){
  if(!curGame)return;
  const btn=document.getElementById('full-btn');
  btn.disabled=true;btn.innerHTML='<span class="spin"></span> Analyzing...';
  document.getElementById('progress-card').style.display='block';
  document.getElementById('summary-card').style.display='none';
  setProgress(0,'Loading Stockfish engine...');

  const ok=await initSF();
  if(!ok){
    document.getElementById('progress-card').style.display='none';
    alert('Could not load Stockfish engine. Please refresh and try again.');
    btn.disabled=false;btn.innerHTML='&#9881; Full analysis';
    return;
  }

  // Build position list
  const tmp=new Chess();
  const fens=[tmp.fen()]; // position before each move
  for(const m of moves){tmp.move(m.san);fens.push(tmp.fen());}

  // Step 1: evaluate every position
  setProgress(0,'Evaluating positions...');
  const evals=[];
  for(let i=0;i<fens.length;i++){
    setProgress(Math.round(i/fens.length*60),'Evaluating position '+(i)+'/'+fens.length+'...');
    evals.push(await evalFen(fens[i],14));
    await yieldUI();
  }

  // Step 2: for each move where played != best, eval the best-move position
  setProgress(60,'Calibrating moves...');
  const bestEvals=new Array(moves.length).fill(null);
  for(let i=0;i<moves.length;i++){
    const played=moves[i].from+moves[i].to+(moves[i].promotion||'');
    const best=evals[i].bestMove;
    if(!best||best===played){bestEvals[i]=null;continue;}
    // Play best move
    const t2=new Chess(fens[i]);
    const moved=t2.move({from:best.slice(0,2),to:best.slice(2,4),promotion:best[4]||'q'});
    if(!moved){bestEvals[i]=null;continue;}
    setProgress(60+Math.round(i/moves.length*35),'Calibrating move '+(i+1)+'...');
    bestEvals[i]=await evalFen(t2.fen(),14);
    await yieldUI();
  }

  // Step 3: classify
  moveEvals=[];
  for(let i=0;i<moves.length;i++){
    const turn=moves[i].color; // 'w' or 'b'
    const wpBefore=evals[i].wpCp;   // white-perspective BEFORE this move
    const wpAfter=evals[i+1].wpCp;  // white-perspective AFTER this move
    // How much did white's eval change?
    const wpDelta=wpAfter-wpBefore;
    // From mover's perspective: white gains = good for white, bad for black
    const moverGain=turn==='w'?wpDelta:-wpDelta;

    // Loss vs best: how much worse is played move vs engine best?
    let lossVsBest=0;
    const played=moves[i].from+moves[i].to;
    const wasBest=!!(evals[i].bestMove&&played===evals[i].bestMove);
    if(!wasBest&&bestEvals[i]!==null){
      const wpBest=bestEvals[i].wpCp;
      const bestGain=turn==='w'?(wpBest-wpBefore):-(wpBest-wpBefore);
      lossVsBest=Math.max(0,bestGain-moverGain);
    }

    // Sacrifice detection: moved piece worth > captured + 1.5 pawns
    const isSac=detectSacrifice(moves[i].from+moves[i].to,new Chess(fens[i]));

    // Classification thresholds in CENTIPAWNS (100cp = 1 pawn)
    // Use generous thresholds because Stockfish depth 14 has eval variance of ~30-50cp
    let cls;
    if(wasBest&&isSac&&moverGain>100) cls='brilliant';      // real sacrifice gaining 1+ pawn
    else if(wasBest&&wpBefore<-300&&moverGain>200) cls='great'; // saving a losing position
    else if(wasBest) cls='best';
    else if(lossVsBest<30) cls='good';          // within 0.3 pawns -- covers engine noise
    else if(lossVsBest<80) cls='inaccuracy';    // 0.3-0.8 pawns worse
    else if(lossVsBest<200) cls='miss';         // 0.8-2.0 pawns worse
    else cls='blunder';                          // 2.0+ pawns worse

    // Never blunder/miss if mover actually improved or held equal
    if(moverGain>=-30){
      if(cls==='blunder')cls='inaccuracy';
      if(cls==='miss')cls='good';
    }
    // Never blunder on a move that kept eval stable (within 50cp of before)
    if(Math.abs(wpAfter-wpBefore)<50&&cls==='blunder')cls='inaccuracy';

    moveEvals.push({wpAfter,wpBefore,moverGain,lossVsBest,wasBest,isSac,cls,bestMove:evals[i].bestMove});
  }

  setProgress(100,'Complete!');
  setTimeout(()=>document.getElementById('progress-card').style.display='none',1200);
  renderMoveList();
  showSummary();
  // Update eval bar to current position
  if(moveIdx>0&&moveEvals[moveIdx-1])updateEvalBar(moveEvals[moveIdx-1].wpAfter);
  btn.disabled=false;btn.innerHTML='&#9881; Re-analyze';
}

function detectSacrifice(uci,ch){
  if(!uci||uci.length<4)return false;
  const p=ch.get(uci.slice(0,2));const t=ch.get(uci.slice(2,4));
  if(!p)return false;
  const v={p:1,n:3,b:3.2,r:5,q:9,k:0};
  return(v[p.type]||0)>(v[t?.type]||0)+1.5;
}

function calcAccuracy(cls){
  const w={brilliant:100,great:100,best:100,good:95,inaccuracy:75,miss:40,blunder:0};
  if(!cls.length)return 0;
  return Math.round(cls.reduce((a,c)=>a+(w[c]||50),0)/cls.length);
}

function showSummary(){
  const isW=isWhiteP(curGame,username);
  const wCls=moveEvals.filter((_,i)=>i%2===0).map(e=>e.cls);
  const bCls=moveEvals.filter((_,i)=>i%2===1).map(e=>e.cls);
  const myCls=isW?wCls:bCls;const oppCls=isW?bCls:wCls;
  const myAcc=calcAccuracy(myCls);const oppAcc=calcAccuracy(oppCls);
  const myP=isW?curGame.white:curGame.black;const oppP=isW?curGame.black:curGame.white;

  function accStyle(a){return a>=85?'background:#dcfce7;color:#166534':a>=70?'background:#fef3c7;color:#92400e':'background:#fee2e2;color:#991b1b';}
  function clsCounts(arr){
    const o={};arr.forEach(c=>{o[c]=(o[c]||0)+1;});
    return Object.entries(CLS).map(([k,v])=>o[k]?'<span style="color:'+v.c+'">'+v.s+' '+o[k]+'</span>':'').filter(Boolean).join(' ');
  }

  const topIsBlack=flipped;
  const topAcc=topIsBlack?oppAcc:myAcc;const botAcc=topIsBlack?myAcc:oppAcc;
  const topP=topIsBlack?oppP:myP;const botP=topIsBlack?myP:oppP;
  const topCls=topIsBlack?oppCls:myCls;const botCls=topIsBlack?myCls:oppCls;

  ['top','bottom'].forEach((pos,pi)=>{
    const acc=pi===0?topAcc:botAcc;
    const el=document.getElementById(pos+'-acc');
    el.style.cssText='font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;'+accStyle(acc);
    el.textContent=acc+'%';el.style.display='inline';
  });

  const grid=document.getElementById('acc-grid');grid.innerHTML='';
  [[topP,topAcc,topCls],[botP,botAcc,botCls]].forEach(([p,acc,cls])=>{
    const div=document.createElement('div');div.className='acc-box';
    div.innerHTML='<div class="acc-name">'+p.username+'</div><div class="acc-val" style="color:'+(acc>=85?'#16a34a':acc>=70?'#f59e0b':'#dc2626')+'">'+acc+'%</div><div class="class-counts">'+clsCounts(cls)+'</div>';
    grid.appendChild(div);
  });
  document.getElementById('summary-card').style.display='block';
}

function setProgress(pct,label){
  document.getElementById('progress-bar').style.width=pct+'%';
  document.getElementById('progress-pct').textContent=pct+'%';
  document.getElementById('progress-label').textContent=label;
}
function yieldUI(){return new Promise(r=>setTimeout(r,0));}

// ── Move analysis panel ───────────────────────────────────
function showMoveAnalysis(){
  if(!moveEvals.length||moveIdx===0){
    document.getElementById('analysis-panel').innerHTML='<div class="no-data">Run full analysis first, then navigate to a move</div>';
    return;
  }
  const ev=moveEvals[moveIdx-1];const m=moves[moveIdx-1];
  const ci=CLS[ev.cls];
  const wpPawns=ev.wpAfter/100;
  const lossPawns=ev.lossVsBest/100;
  let html='<div class="class-badge" style="background:'+ci.bg+';color:'+ci.c+'">'+ci.s+' '+ci.l+'</div><br>';
  const evalStr=(wpPawns>=0?'+':'')+wpPawns.toFixed(2);
  html+='<div class="eval-score-display" style="color:'+(ev.wpAfter>30?'#16a34a':ev.wpAfter<-30?'#dc2626':'#888')+'">'+evalStr+'</div>';
  html+='<div style="font-size:12px;color:var(--text-muted);margin-bottom:6px">Move '+moveIdx+': '+m.san;
  if(ev.wasBest)html+=' (best move)';
  else if(ev.lossVsBest>5)html+=' (lost '+lossPawns.toFixed(2)+' pawns vs best)';
  html+='</div>';
  if(!ev.wasBest&&ev.bestMove){
    html+='<div class="best-move-box">&#9881; Engine best: <strong>'+ev.bestMove+'</strong></div>';
  }
  html+='<div id="ai-spot"><button class="green-btn" onclick="explainMove()" style="width:100%;justify-content:center;font-size:12px;margin-top:8px">&#9881; Explain this move</button></div>';
  document.getElementById('analysis-panel').innerHTML=html;
}

async function explainMove(){
  if(moveIdx===0)return;
  const btn=document.getElementById('explain-btn');
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> Explaining...';}
  const spot=document.getElementById('ai-spot');
  if(spot)spot.innerHTML='<div class="ai-box"><div class="ld"><span></span><span></span><span></span></div></div>';

  const m=moves[moveIdx-1];
  const ev=moveEvals.length?moveEvals[moveIdx-1]:null;
  const fen=chess.fen();
  const sys='You are a chess coach. Explain chess moves clearly in 2-3 sentences. Mention specific pieces, squares, and strategic or tactical ideas. Be direct and educational.';
  let prompt='FEN: '+fen+'\nMove '+moveIdx+': '+m.san+' ('+(m.color==='w'?'White':'Black')+')';
  if(ev){
    prompt+='\nEval after move: '+(ev.wpAfter>0?'+':'')+(ev.wpAfter/100).toFixed(2)+' pawns (positive=white winning)';
    if(ev.cls)prompt+='\nClassification: '+CLS[ev.cls].l;
    if(!ev.wasBest&&ev.bestMove)prompt+='\nEngine best was: '+ev.bestMove;
    if(ev.lossVsBest>5)prompt+='\nLoss vs best move: '+(ev.lossVsBest/100).toFixed(2)+' pawns';
  }
  if(chess.in_check())prompt+='\nKing is in check after this move.';
  prompt+='\n\nExplain what this move does, why it is '+( ev?CLS[ev.cls].l:'notable')+', and what both sides should consider next.';

  try{
    const res=await fetch(EDGE,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_KEY},
      body:JSON.stringify({system:sys,messages:[{role:'user',content:prompt}]})
    });
    if(!res.ok){const t=await res.text();throw new Error(res.status+': '+t.slice(0,100));}
    const data=await res.json();
    const reply=data.reply||JSON.stringify(data);
    if(spot)spot.innerHTML='<div class="ai-box">'+reply+'</div>';
  }catch(e){
    console.error('AI error:',e);
    if(spot)spot.innerHTML='<div class="ai-box" style="color:var(--orange)">Could not get explanation: '+e.message+'</div>';
  }
  if(btn){btn.disabled=false;btn.innerHTML='&#9881; Explain move';}
}

// ── Chess.com API ─────────────────────────────────────────
async function loadProfile(){
  const u=document.getElementById('username-input').value.trim().toLowerCase();
  if(!u)return;
  const btn=document.getElementById('search-btn');const err=document.getElementById('search-err');
  btn.disabled=true;btn.innerHTML='<span class="spin"></span> Loading...';err.style.display='none';
  try{
    const[pR,sR]=await Promise.all([fetch('https://api.chess.com/pub/player/'+u),fetch('https://api.chess.com/pub/player/'+u+'/stats')]);
    if(!pR.ok)throw new Error('Player "'+u+'" not found');
    const p=await pR.json();const s=await sR.json();
    username=u;renderProfile(p,s);await loadGames(u);
    document.getElementById('search-section').style.display='none';
    document.getElementById('profile-section').style.display='block';
  }catch(e){err.textContent=e.message;err.style.display='block';}
  btn.disabled=false;btn.innerHTML='&#9654; Load games';
}

function renderProfile(p,s){
  const av=document.getElementById('profile-avatar');
  if(p.avatar)av.innerHTML='<img src="'+p.avatar+'"/>';else av.innerHTML='&#128100;';
  document.getElementById('profile-name').textContent=p.username;
  document.getElementById('profile-sub').textContent=(p.title?p.title+' | ':'')+( p.location||'Chess.com');
  const r=[];
  if(s.chess_bullet)r.push('<span class="stat-pill">&#9889; '+s.chess_bullet.last.rating+'</span>');
  if(s.chess_blitz)r.push('<span class="stat-pill">&#128293; '+s.chess_blitz.last.rating+'</span>');
  if(s.chess_rapid)r.push('<span class="stat-pill">&#9201; '+s.chess_rapid.last.rating+'</span>');
  document.getElementById('profile-stats').innerHTML=r.join('');
}

async function loadGames(u){
  const el=document.getElementById('game-list');
  el.innerHTML='<div class="no-data"><span class="spin"></span> Fetching games...</div>';
  const aR=await fetch('https://api.chess.com/pub/player/'+u+'/games/archives');
  const aD=await aR.json();const archives=aD.archives||[];
  if(!archives.length){el.innerHTML='<div class="no-data">No games found.</div>';return;}
  let games=[];
  for(const url of archives.slice(-2).reverse()){
    const r=await fetch(url);const d=await r.json();
    games=[...games,...(d.games||[])];if(games.length>=60)break;
  }
  allGames=games.reverse().slice(0,60);filterGames();
}

function getTC(g){return g.time_class||'unknown';}
function getResult(g,u){
  const iW=g.white.username.toLowerCase()===u.toLowerCase();
  const r=iW?g.white.result:g.black.result;
  if(r==='win')return 'win';
  if(['checkmated','timeout','resigned','lose','abandoned'].includes(r))return 'loss';
  return 'draw';
}
function getOpp(g,u){return g.white.username.toLowerCase()===u.toLowerCase()?g.black:g.white;}
function isWhiteP(g,u){return g.white.username.toLowerCase()===u.toLowerCase();}

function filterGames(){
  const tc=document.getElementById('tc-filter').value;
  const res=document.getElementById('res-filter').value;
  filtGames=allGames.filter(g=>{
    if(tc!=='all'&&getTC(g)!==tc)return false;
    if(res!=='all'&&getResult(g,username)!==res)return false;
    return true;
  });renderGameList();
}

function renderGameList(){
  const el=document.getElementById('game-list');
  if(!filtGames.length){el.innerHTML='<div class="no-data">No games match filters.</div>';return;}
  el.innerHTML='';
  filtGames.forEach(g=>{
    const result=getResult(g,username);const opp=getOpp(g,username);
    const isW=isWhiteP(g,username);const tc=getTC(g);
    const date=g.end_time?new Date(g.end_time*1000).toLocaleDateString():'';
    const div=document.createElement('div');div.className='game-item'+(curGame===g?' selected':'');
    div.innerHTML='<div style="flex:1"><div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">'
      +'<span style="font-size:10px;background:'+(isW?'#f0ece4':'#333')+';color:'+(isW?'#333':'#f0ece4')+';padding:1px 5px;border-radius:3px;font-weight:700">'+(isW?'W':'B')+'</span>'
      +'<span style="font-size:13px;font-weight:600">'+opp.username+'</span>'
      +'<span style="font-size:12px;color:var(--text-muted)">('+opp.rating+')</span>'
      +'</div><div class="game-meta">'+tc.charAt(0).toUpperCase()+tc.slice(1)+' &middot; '+date+'</div></div>'
      +'<span class="game-result result-'+result+'">'+result.charAt(0).toUpperCase()+result.slice(1)+'</span>';
    div.onclick=()=>openGame(g);el.appendChild(div);
  });
}

// ── Board ─────────────────────────────────────────────────
function buildBoard(){
  const el=document.getElementById('chess-board');el.innerHTML='';
  const sq=Math.max(34,Math.min(48,Math.floor((Math.min(window.innerWidth,500)-50)/8)));
  document.getElementById('eval-bar').style.height=(sq*8)+'px';
  for(let r=0;r<8;r++) for(let f=0;f<8;f++){
    const vR=flipped?r:7-r;const vF=flipped?7-f:f;
    const light=(vR+vF)%2===1;
    const div=document.createElement('div');
    div.className='sq '+(light?'light':'dark');
    div.style.width=sq+'px';div.style.height=sq+'px';div.style.fontSize=Math.floor(sq*.72)+'px';
    if(vF===0){const c=document.createElement('span');c.className='coord-rank';c.textContent=vR+1;div.appendChild(c);}
    if(vR===0){const c=document.createElement('span');c.className='coord-file';c.textContent='abcdefgh'[vF];div.appendChild(c);}
    div.dataset.sq='abcdefgh'[vF]+(vR+1);
    el.appendChild(div);
  }
  renderPieces();
}

function renderPieces(){
  if(!chess)return;
  document.querySelectorAll('.sq').forEach(sq=>{
    const o=sq.querySelector('.piece');if(o)o.remove();
    const p=chess.get(sq.dataset.sq);
    if(p){const s=document.createElement('span');s.className='piece';s.innerHTML=PIECES[(p.color==='w'?'w':'b')+p.type.toUpperCase()]||'?';sq.appendChild(s);}
  });
  // Highlight last move
  document.querySelectorAll('.sq').forEach(s=>s.classList.remove('last-from','last-to','check'));
  if(moveIdx>0){
    const m=moves[moveIdx-1];
    const f=document.querySelector('.sq[data-sq="'+m.from+'"]');
    const t=document.querySelector('.sq[data-sq="'+m.to+'"]');
    if(f)f.classList.add('last-from');if(t)t.classList.add('last-to');
  }
  if(chess.in_check()){
    const turn=chess.turn();
    for(let r=1;r<=8;r++)for(const f of 'abcdefgh'){const p=chess.get(f+r);if(p&&p.type==='k'&&p.color===turn){const s=document.querySelector('.sq[data-sq="'+f+r+'"]');if(s)s.classList.add('check');}}
  }
}

function openGame(g){
  curGame=g;moveEvals=[];filtGames;filterGames();
  chess=new Chess();chess.load_pgn(g.pgn);
  moves=chess.history({verbose:true});moveIdx=0;chess.reset();
  const isW=isWhiteP(g,username);flipped=!isW;
  const top=flipped?g.white:g.black;const bot=flipped?g.black:g.white;
  document.getElementById('top-name').textContent=top.username;
  document.getElementById('top-rating').textContent=' ('+top.rating+')';
  document.getElementById('bottom-name').textContent=bot.username;
  document.getElementById('bottom-rating').textContent=' ('+bot.rating+')';
  document.getElementById('top-acc').style.display='none';
  document.getElementById('bottom-acc').style.display='none';
  document.getElementById('summary-card').style.display='none';
  document.getElementById('progress-card').style.display='none';
  const result=getResult(g,username);
  document.getElementById('game-title').textContent=(isW?'White':'Black')+' vs '+getOpp(g,username).username+' — '+result;
  buildBoard();renderMoveList();updateEvalBar(0);
  document.getElementById('analysis-panel').innerHTML='<div class="no-data">Run full analysis or navigate to a move after analysis</div>';
  document.getElementById('profile-section').style.display='none';
  document.getElementById('board-section').style.display='block';
  document.getElementById('full-btn').disabled=false;document.getElementById('full-btn').innerHTML='&#9881; Full analysis';
}

function closeBoard(){
  document.getElementById('board-section').style.display='none';
  document.getElementById('profile-section').style.display='block';
  curGame=null;filterGames();
}

function goToMove(idx){
  idx=Math.max(0,Math.min(idx,moves.length));moveIdx=idx;
  chess.reset();for(let i=0;i<idx;i++)chess.move(moves[i].san);
  renderPieces();renderMoveList();
  if(moveEvals.length&&idx>0&&moveEvals[idx-1])updateEvalBar(moveEvals[idx-1].wpAfter);
  else if(idx===0)updateEvalBar(0);
  const btn=document.getElementById('move-btn-'+(idx-1));
  if(btn)btn.scrollIntoView({block:'nearest'});
  if(moveEvals.length)showMoveAnalysis();
}
function prevMove(){goToMove(moveIdx-1);}
function nextMove(){goToMove(moveIdx+1);}
function flipBoard(){flipped=!flipped;buildBoard();}

function renderMoveList(){
  const el=document.getElementById('move-list');el.innerHTML='';
  moves.forEach((m,i)=>{
    if(i%2===0){const n=document.createElement('span');n.className='move-num';n.textContent=(Math.floor(i/2)+1)+'.';el.appendChild(n);}
    const btn=document.createElement('button');
    btn.className='move-btn'+(i===moveIdx-1?' active':'');
    btn.id='move-btn-'+i;
    const ev=moveEvals[i];
    if(ev&&i!==moveIdx-1){
      const ci=CLS[ev.cls];
      btn.textContent=m.san+(ev.cls!=='best'&&ev.cls!=='good'?' '+ci.s:'');
      if(!['best','good','brilliant','great'].includes(ev.cls))btn.style.color=ci.c;
    }else btn.textContent=m.san;
    btn.onclick=()=>goToMove(i+1);
    el.appendChild(btn);
  });
}

function updateEvalBar(wp){
  const s=isNaN(wp)?0:Math.max(-1000,Math.min(1000,wp));
  // Convert to display: +1000 = all white, -1000 = all black
  // Map to percentage: 50% = equal, 100% = white winning completely
  const pctWhite=50+s/20; // 1 pawn = 5%
  const bp=Math.max(5,Math.min(95,100-pctWhite));
  document.getElementById('eval-black').style.height=bp+'%';
  document.getElementById('eval-white').style.height=(100-bp)+'%';
  const n=document.getElementById('eval-num');
  const display=Math.abs(s)>=900?'M':(s>=0?'+':'')+(s/100).toFixed(1);
  n.textContent=display;
  n.style.color=s>30?'#16a34a':s<-30?'#dc2626':'#888';
}

function showTab(tab,btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
  document.getElementById('tab-moves').style.display=tab==='moves'?'block':'none';
  document.getElementById('tab-analysis').style.display=tab==='analysis'?'block':'none';
  if(tab==='analysis'&&moveEvals.length&&moveIdx>0)showMoveAnalysis();
}

function resetSearch(){
  document.getElementById('search-section').style.display='block';
  document.getElementById('profile-section').style.display='none';
  document.getElementById('board-section').style.display='none';
  username='';allGames=[];
}

document.addEventListener('keydown',e=>{
  if(document.getElementById('board-section').style.display==='none')return;
  if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;
  if(e.key==='ArrowLeft'){e.preventDefault();prevMove();}
  if(e.key==='ArrowRight'){e.preventDefault();nextMove();}
});
window.addEventListener('resize',()=>{if(curGame)buildBoard();});
</script>
